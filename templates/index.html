
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodExpress - Online Food Ordering</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>🍴 FoodExpress</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#cart">Cart</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1>Delicious Food, Delivered Fresh</h1>
        <p>Order your favorite meals from FoodExpress.</p>
        <a href="#menu" class="hero-btn">Explore Menu</a>
    </section>

    <section id="menu" class="menu-section">
        <h2>Explore Our Menu</h2>

        <div class="filters">
            <input type="text" id="search"
                   placeholder="Search food items...">

            <select id="category">
                <option value="All">All Categories</option>
            </select>
        </div>

        <div id="menu-container"></div>
    </section>

    <section id="cart" class="cart-section">
        <h2>🛒 Your Shopping Cart</h2>

        <div id="cart-items">
            Your cart is empty.
        </div>

        <h3>Total: $<span id="total">0.00</span></h3>

        
<div style="margin-top: 20px;">
    <label for="customer">Select Customer:</label>

    <select id="customer">
        <option value="">Select Customer</option>
        <option value="1">Rahul Sharma</option>
        <option value="2">Priya Reddy</option>
        <option value="3">John Smith</option>
        <option value="4">Ananya Patel</option>
        <option value="5">David Wilson</option>
    </select>
</div>

<button id="checkout-btn">Place Order</button>

<p id="order-message" style="margin-top: 15px;"></p>

    </section>

    <footer>
        <p>FoodExpress | Online Food Ordering System</p>
        <p>Computer Science Database Project</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
